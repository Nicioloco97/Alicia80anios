<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Goudy+Bookletter+1911&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="img/icono/pngwing.com.ico">
    <link rel="stylesheet" href="style.css">
    <title>80 Irene Alicia Huertas</title>
</head>
<body>
    <div class="page">
        <main class="card welcome-card">
            <div class="envelope-wrap">
                <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Abrir invitación">
                    <img class="corner-flower" src="img/corner_flower.png" alt="" aria-hidden="true">
                    <div class="door door-top" aria-hidden="true"></div>
                    <div class="door door-left" aria-hidden="true"></div>
                    <div class="door door-right" aria-hidden="true"></div>
                    <img class="seal" src="img/pngwing.com.png" alt="Sello" aria-hidden="true">
                    <p class="instructions">Toque El Sello Para Abrir</p>

                    <div class="paper">
                        <svg class="paper-border" viewBox="0 0 1000 700" preserveAspectRatio="none" aria-hidden="true">
                            <path class="paper-line" d="M82 45 H918 M82 655 H918 M55 72 V628 M945 72 V628" />
                            <path class="paper-star" d="M55 18 L62 38 L82 45 L62 52 L55 72 L48 52 L28 45 L48 38 Z M945 18 L952 38 L972 45 L952 52 L945 72 L938 52 L918 45 L938 38 Z M55 628 L62 648 L82 655 L62 662 L55 682 L48 662 L28 655 L48 648 Z M945 628 L952 648 L972 655 L952 662 L945 682 L938 662 L918 655 L938 648 Z" />
                        </svg>
                        <svg class="paper-title-decoration" viewBox="0 0 600 28" aria-hidden="true">
                            <path d="M8 14 H255 M345 14 H592 M276 14 L288 4 L300 14 L288 24 Z M300 14 L312 4 L324 14 L312 24 Z" />
                        </svg>
                        <h2>Invitación</h2>
                        <p id="edad">80 años</p>
                        <svg class="paper-age-decoration" viewBox="0 0 360 20" aria-hidden="true">
                            <path d="M8 10 H150 M210 10 H352 M168 10 L180 3 L192 10 L180 17 Z" />
                        </svg>
                        <p id="nombre">Irene Alicia Huertas</p>
                        <p id="welcome_text">Tu presencia hará de este día<br>un momento aún más especial.</p>
                        <a class="btn-primary" href="invitacion.html">
                            <p>I</p>
                            ngresar
                        </a>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
