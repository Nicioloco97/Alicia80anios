<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Pacifico&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Dancing+Script:wght@400..700&family=Pacifico&family=Sacramento&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Dancing+Script:wght@400..700&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="img/icono/pngwing.com.ico">
    <link rel="stylesheet" href="style.css">
    <title>80 Irene Alicia Huertas</title>
</head>
<body>
    <div class="page">
        <main class="card welcome-card">
            <div class="envelope-wrap">
                <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Abrir invitación">
                    <img class="corner-flower" src="img/corner_flower.png" alt="" aria-hidden="true">
                    <div class="door door-top" aria-hidden="true"></div>
                    <div class="door door-left" aria-hidden="true"></div>
                    <div class="door door-right" aria-hidden="true"></div>
                    <img class="seal" src="img/pngwing.com.png" alt="Sello" aria-hidden="true">
                    <p class="instructions">Toque El Sello Para Abrir</p>

                    <div class="paper">
                        <h2>Invitación</h2>
                        <p id="edad">80 años</p>
                        <p id="nombre">Irene Alicia Huertas</p>
                        <a class="btn-primary" href="invitacion.html">Ingresar</a>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
